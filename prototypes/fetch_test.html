<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SharePoint List Fetch Test</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 0;
        padding: 12px;
      }
      #status {
        font-size: 12px;
        color: #555;
        margin-bottom: 8px;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
        margin: 0;
      }
      .err {
        color: #b00020;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="status">Status: HTML loaded</div>
    <pre id="out"></pre>

    <script>
      console.log("test")
      (function () {
        console.log("test")
        const siteUrl = "https://mdigital.sharepoint.com/sites/ITOTCommunityHub";
        const listTitle = "IT/OT Convergence Plan";

        const statusEl = document.getElementById("status");
        console.log("Works1")
        const outEl = document.getElementById("out");
        console.log("Works2")
        const setStatus = (s) => (statusEl.textContent = "Status: " + s);
        const esc = (s) =>
          String(s).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;");

        window.addEventListener("error", (ev) => {
          setStatus("ERROR (runtime)");
          outEl.innerHTML = `<span class="err">Runtime error</span>\n\n${esc(
            ev?.error?.stack || ev?.message || ev
          )}`;
        });
        window.addEventListener("unhandledrejection", (ev) => {
          setStatus("ERROR (promise)");
          outEl.innerHTML = `<span class="err">Unhandled promise rejection</span>\n\n${esc(
            ev?.reason?.stack || ev?.reason?.message || ev?.reason || ev
          )}`;
        });

        setStatus("JS ran, fetching…");

        (async () => {
          const url =
            `${siteUrl.replace(/\/$/, "")}` +
            `/_api/web/lists/getbytitle('${listTitle.replaceAll("'", "''")}')/items` +
            `?$top=5&$select=Id,Title`;

          console.log("[fetch_test] url:", url);

          const res = await fetch(url, {
            headers: { Accept: "application/json;odata=nometadata" },
            credentials: "same-origin",
          });

          setStatus(`${res.status} ${res.statusText}`);

          const text = await res.text();
          if (!res.ok) {
            outEl.innerHTML = `<span class="err">HTTP error</span>\n\n${esc(text)}`;
            return;
          }

          const json = JSON.parse(text);
          console.log("[fetch_test] items:", json.value);
          outEl.textContent = JSON.stringify(json, null, 2);
        })();
      })();
    </script>
  </body>
</html>
