<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SharePoint Projects Table</title>
    <style>
      :root {
        --sp-text: inherit;
        --sp-muted: rgba(0, 0, 0, 0.72);
        --sp-accent: #f4c84a;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
        color: var(--sp-text);
        background: transparent;
      }

      .sp-projects {
        width: 100%;
        max-width: 1100px;
        margin: 0 auto;
        padding: 0;
        box-sizing: border-box;
      }

      .sp-rowgroup {
        background: transparent;
        border: 0;
        border-radius: 0;
        overflow: visible;
      }

      .sp-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .sp-cell {
        padding: 18px 18px 20px 18px;
        min-width: 0;
      }

      /* table-like dividers */
      .sp-cell {
        border-top: 0;
      }
      .sp-cell:nth-child(-n + 2) {
        border-top: 0;
      }
      .sp-cell:nth-child(odd) {
        border-right: 0;
      }

      .sp-title {
        margin: 0;
        font-size: 18px;
        font-weight: 800;
        line-height: 1.2;
      }

      .sp-stack {
        margin-top: 12px;
        display: grid;
        gap: 12px;
      }

      .sp-bullets {
        margin: 0;
        padding-left: 18px;
        color: inherit;
        font-size: 16px;
      }

      .sp-bullets li {
        margin: 6px 0;
        color: var(--sp-muted);
        line-height: 1.35;
      }

      .sp-details {
        margin: 0;
      }

      .sp-summary {
        list-style: none;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        color: inherit;
        padding: 0;
      }

      .sp-summary::-webkit-details-marker {
        display: none;
      }

      .sp-summary:focus-visible {
        outline: 3px solid rgba(244, 200, 74, 0.55);
        outline-offset: 2px;
        border-radius: 8px;
      }

      .sp-pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 800;
        border-radius: 999px;
        background: rgba(244, 200, 74, 0.16);
        border: 1px solid rgba(244, 200, 74, 0.38);
        color: var(--sp-accent);
        flex: 0 0 auto;
      }

      .sp-chevron {
        width: 18px;
        height: 18px;
        flex: 0 0 auto;
        transition: transform 180ms ease;
        opacity: 0.9;
      }

      .sp-details[open] .sp-chevron {
        transform: rotate(180deg);
      }

      .sp-panelInner {
        padding: 8px 0 0 0;
      }

      .sp-projectList {
        margin: 0;
        padding-left: 18px;
        font-size: 14px;
      }

      .sp-projectList li {
        margin: 8px 0;
        color: var(--sp-muted);
        line-height: 1.35;
      }

      .sp-projectList strong {
        color: var(--sp-text);
      }

      @media (max-width: 720px) {
        .sp-grid {
          grid-template-columns: 1fr;
        }
        .sp-cell {
          border-right: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Projects webpart container.
      Duplicate this whole block for other years and change data-year.
    -->
    <section
      class="sp-projects"
      data-sp-projects
      data-site-url="https://mdigital.sharepoint.com/sites/ITOTCommunityHub"
      data-list-title="IT/OT Convergence Plan"
      data-year="2026"
      aria-label="Projects table"
    >
      <div class="sp-rowgroup">
        <div class="sp-grid" data-sp-grid aria-live="polite"></div>
      </div>
    </section>

    <!--
      IMPORTANT: Inline scripts are blocked by your SharePoint CSP.
      Upload `projects-webpart.js` to a library (e.g. Site Assets) and reference it here.
    -->
    <script src="https://mdigital.sharepoint.com/:u:/r/sites/ITOTCommunityHub/SiteAssets/scripts/itot-convergence-plan/projects-webpart.js?csf=1&web=1&e=hBfK6D"></script>
  </body>
</html>
