<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SharePoint Script Webpart - Hex Badge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Replace with your SharePoint image URL */
        --bg-url: url("https://mdigital.sharepoint.com/:i:/r/sites/ITOTCommunityHub/SiteAssets/Visuals/Banners/timeline-background.png?csf=1&web=1&e=ugI09M");

        --hex-pink: #e73b97;
        --year-yellow: #f4c84a;
        --text-white: #ffffff;
        --line-color: var(--year-yellow);
        --line-width: 12;
        --dash: 18;
        --gap: 20;
        --speed: 60s;
        /* Keep travel aligned to dash+gap period (18+20=38) to avoid any seam/jump. */
        --travel: 3990; /* 105 * 38 */

        /* Layout tuning */
        --badge-top: calc(clamp(10px, 7.5cqw, 54px) - 40px);
        /* Behind-hexagon start position (used as default; can be overridden inline) */
        --line-start-behind: calc(var(--badge-top) + clamp(140px, 18vw, 220px));

        /* If Merck corporate font is available in your tenant, set it here */
        --merck-font:
          "Merck",
          "Merck Grotesk",
          "MerckType",
          "Merck Type",
          "Merck Sans",
          "MerckSans",
          "Montserrat",
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        font-family:
          "Montserrat",
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Arial,
          sans-serif;
      }

      .sp-hero {
        position: relative;
        width: 100%;
        /* Size from the web part width (great for 1/3 section columns) */
        aspect-ratio: 9 / 16;
        min-height: 320px;
        /* 1 = curve right, -1 = curve left (override inline on this element) */
        --line-flip: 1;
        /* Line start (override inline): 0px = start at top; var(--line-start-behind) = behind hex */
        --line-start: var(--line-start-behind);
        background-image: var(--bg-url);
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        overflow: hidden;
      }

      /* Per-instance configuration via HTML attributes (recommended) */
      .sp-hero[data-curve="left"] {
        --line-flip: -1;
      }
      .sp-hero[data-curve="right"] {
        --line-flip: 1;
      }
      .sp-hero[data-line-start="top"] {
        --line-start: 0px;
      }
      .sp-hero[data-line-start="behind"] {
        --line-start: var(--line-start-behind);
      }

      .sp-hero-inner {
        position: relative;
        width: 100%;
        height: 100%;
        display: grid;
        place-items: start center;
        padding: clamp(12px, 2.8vw, 28px);
        box-sizing: border-box;
        z-index: 2;
      }

      /* Optional subtle contrast layer (tuned to not overpower the background) */
      .sp-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle at 50% 40%,
          rgba(0, 0, 0, 0.08),
          rgba(0, 0, 0, 0.18)
        );
        pointer-events: none;
      }

      .sp-year-line {
        position: absolute;
        left: 50%;
        top: 0;
        bottom: 0;
        width: 140px; /* room for big swings; stroke thickness via --line-width */
        transform: translateX(-50%);
        opacity: 0.95;
        z-index: 1; /* behind the hexagon */
        pointer-events: none;
        clip-path: inset(max(0px, var(--line-start)) 0 0 0);
      }

      .sp-year-line-svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        transform: scaleX(var(--line-flip));
        transform-origin: 50% 50%;
      }

      .sp-year-line-path {
        fill: none;
        stroke: var(--line-color);
        stroke-width: var(--line-width);
        vector-effect: non-scaling-stroke;
        stroke-linecap: butt;
        stroke-linejoin: round;
        stroke-dasharray: calc(var(--dash) * 1px) calc(var(--gap) * 1px);
        animation: spDashDown var(--speed) linear infinite;
        will-change: stroke-dashoffset;
      }

      /* Move dashes DOWN the line. Travel is aligned to dash+gap to avoid seams. */
      @keyframes spDashDown {
        from {
          stroke-dashoffset: 0;
        }
        to {
          /* Animate far enough that it never appears to "stop" */
          stroke-dashoffset: calc(-1 * (var(--travel) * 1px));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .sp-year-line-path {
          animation: none;
        }
      }

      .sp-badge {
        position: relative;
        /* Smaller + safe for narrow columns */
        width: min(660px, 92%);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        /* Let text scale from badge width */
        container-type: inline-size;
        /* Upper-third positioning */
        margin-top: var(--badge-top);
      }

      .sp-badge svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.22));
      }

      .sp-badge-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 16%;
        box-sizing: border-box;
        gap: clamp(8px, 3cqw, 14px);
      }

      .sp-year {
        margin: 0;
        font-size: clamp(48px, 22cqw, 156px);
        line-height: 1;
        letter-spacing: 0.04em;
        font-weight: 800;
        color: var(--year-yellow);
        text-transform: uppercase;
        font-family: var(--merck-font);
      }

      .sp-subtitle {
        margin: 0;
        font-size: clamp(18px, 7.2cqw, 48px);
        line-height: 1.15;
        letter-spacing: 0.14em;
        font-weight: 700;
        color: var(--text-white);
        text-transform: uppercase;
      }

      .sp-subtitle span {
        display: block;
      }

      @media (max-width: 420px) {
        .sp-hero {
          min-height: 280px;
        }
        .sp-badge-content {
          padding: 18%;
        }
      }
    </style>

  </head>
  <body>
    <section class="sp-hero" data-curve="left" data-line-start="behind" aria-label="Program badge">
      <div class="sp-year-line" aria-hidden="true">
        <svg
          class="sp-year-line-svg"
          viewBox="0 0 100 100"
          preserveAspectRatio="none"
          focusable="false"
        >
          <!-- Straight at start/end for seamless stacking; smooth curves in the middle -->
          <path
            class="sp-year-line-path"
            d="M50 0
               L50 12
               C50 28 30 30 38 48
               C46 66 70 66 62 84
               C58 92 50 92 50 100"
          />
        </svg>
      </div>

      <div class="sp-hero-inner">
        <div class="sp-badge" role="img" aria-label="Rounded hexagon badge: 2022 forming the program">
          <!-- Rounded-corner flat-top hexagon using an SVG path -->
          <svg viewBox="0 0 100 86.602" aria-hidden="true" focusable="false">
            <path
              d="M 32 0
                 L 68 0
                 Q 75 0 78.5 6.062
                 L 96.5 37.239
                 Q 100 43.301 96.5 49.363
                 L 78.5 80.54
                 Q 75 86.602 68 86.602
                 L 32 86.602
                 Q 25 86.602 21.5 80.54
                 L 3.5 49.363
                 Q 0 43.301 3.5 37.239
                 L 21.5 6.062
                 Q 25 0 32 0
                 Z"
              fill="var(--hex-pink)"
            />
          </svg>

          <div class="sp-badge-content">
            <p class="sp-year">2026</p>
            <p class="sp-subtitle">
              <span>EMPOWER &</span>
              <span>SCALE</span>
            </p>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
