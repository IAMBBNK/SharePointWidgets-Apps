<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Carousel</title>
    <style>
      .imgc-widget,
      .imgc-overlay {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        box-sizing: border-box;
        color: #1f1f1f;
      }

      .imgc-widget *,
      .imgc-widget *::before,
      .imgc-widget *::after,
      .imgc-overlay *,
      .imgc-overlay *::before,
      .imgc-overlay *::after {
        box-sizing: border-box;
      }

      .imgc-widget {
        display: flex;
        width: 100%;
      }

      .imgc-widget.is-center {
        justify-content: center;
      }

      .imgc-widget.is-right {
        justify-content: flex-end;
      }

      .imgc-trigger {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 0;
        border: none;
        border-radius: 5px;
        padding: 12px 18px;
        background: #0f69af;
        color: #fff;
        font-family: inherit;
        font-size: 15px;
        font-weight: 600;
        line-height: 1.2;
        cursor: pointer;
        box-shadow: 0 1px 2px rgba(15, 105, 175, 0.25);
      }

      .imgc-trigger:hover,
      .imgc-trigger:focus-visible {
        filter: brightness(1.08);
        outline: none;
      }

      .imgc-trigger:focus-visible {
        box-shadow: 0 0 0 3px rgba(15, 105, 175, 0.35);
      }

      .imgc-trigger-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        flex: 0 0 auto;
        display: block;
      }

      .imgc-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000000;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 28px 64px 36px;
        background: rgba(120, 120, 120, 0.88);
      }

      .imgc-overlay.is-open {
        display: flex;
      }

      .imgc-overlay-inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: min(980px, 100%);
        gap: 18px;
      }

      .imgc-overlay.is-single .imgc-overlay-inner {
        width: min(440px, 100%);
      }

      .imgc-close {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.92);
        color: #333;
        font-size: 26px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }

      .imgc-close:hover,
      .imgc-close:focus-visible {
        background: #fff;
        outline: none;
      }

      .imgc-stage {
        display: flex;
        align-items: center;
        width: 100%;
        gap: 8px;
      }

      .imgc-viewport {
        flex: 1;
        overflow: hidden;
        min-width: 0;
      }

      .imgc-cards {
        display: flex;
        gap: 16px;
        width: 100%;
      }

      .imgc-cards.is-animating {
        animation: imgc-slide 0.32s ease;
      }

      .imgc-cards.is-animating-prev {
        animation: imgc-slide-prev 0.32s ease;
      }

      @keyframes imgc-slide {
        from {
          opacity: 0.35;
          transform: translateX(28px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      @keyframes imgc-slide-prev {
        from {
          opacity: 0.35;
          transform: translateX(-28px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .imgc-card {
        flex: 1 1 0;
        min-width: 0;
        background: #fff;
        border-radius: 12px;
        padding: 12px 12px 16px;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
      }

      .imgc-card-image-wrap {
        width: 100%;
        height: 168px;
        border-radius: 10px;
        overflow: hidden;
        background: #ececec;
      }

      .imgc-overlay.is-single .imgc-card-image-wrap {
        height: 260px;
      }

      .imgc-card-image {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .imgc-card-title {
        margin: 12px 4px 4px;
        font-size: 16px;
        font-weight: 700;
        line-height: 1.3;
        color: #111;
      }

      .imgc-card-desc {
        margin: 0 4px;
        font-size: 13px;
        line-height: 1.45;
        color: #6b6b6b;
      }

      .imgc-nav {
        flex: 0 0 auto;
        width: 48px;
        height: 48px;
        border: none;
        border-radius: 50%;
        background: #3a3a3a;
        color: #fff;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.28);
        padding: 0;
      }

      .imgc-nav:hover,
      .imgc-nav:focus-visible {
        background: #2b2b2b;
        outline: none;
      }

      .imgc-nav svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .imgc-nav.is-hidden,
      .imgc-dots.is-hidden {
        visibility: hidden;
        pointer-events: none;
      }

      .imgc-dots {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 12px;
      }

      .imgc-dot {
        width: 9px;
        height: 9px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: #c8c8c8;
        cursor: pointer;
      }

      .imgc-dot.is-active {
        background: #7cb342;
      }

      .imgc-dot:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 2px;
      }

      .imgc-empty {
        color: #b00020;
        font-size: 13px;
        font-weight: 600;
      }

      @media (max-width: 720px) {
        .imgc-overlay {
          padding: 56px 12px 24px;
        }

        .imgc-stage {
          gap: 6px;
        }

        .imgc-nav {
          width: 38px;
          height: 38px;
        }

        .imgc-card-image-wrap,
        .imgc-overlay.is-single .imgc-card-image-wrap {
          height: 190px;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Customize the config below, then paste this file into a SharePoint Embed web part.
      Upload imageCarousel.js to SiteAssets/scripts/ and point the script src there:

      https://mdigital.sharepoint.com/sites/ITOTCommunityHub/SiteAssets/scripts/imageCarousel.js?v=1

      buttonText  – button label
      buttonIcon  – image/icon URL, or "" for text only
      buttonColor – optional, default #0f69af
      buttonAlign – "left" | "center" | "right"
      visibleCount – 1 or 3 cards in the popup (drops to 1 on small screens)
    -->
    <div id="itot-image-carousel"></div>

    <script>
      window.ITOT_IMAGE_CAROUSEL = {
        buttonText: "View gallery",
        buttonIcon:
          "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='white'%3E%3Cpath d='M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z'/%3E%3C/svg%3E",
        buttonColor: "#0f69af",
        buttonAlign: "left",
        visibleCount: 3,
        items: [
          {
            image: "https://picsum.photos/id/1015/900/560",
            title: "Autumn",
            description: "Autumn, a season full of great things."
          },
          {
            image: "https://picsum.photos/id/1025/900/560",
            title: "Big Buck Bunny",
            description: "A short computer animated film by the Blender Institute."
          },
          {
            image: "https://picsum.photos/id/1019/900/560",
            title: "Night in The City",
            description: "Silent and beautiful night in the city"
          },
          {
            image: "https://picsum.photos/id/1036/900/560",
            title: "Mountain lake",
            description: "Calm water and a wide view across the valley."
          },
          {
            image: "https://picsum.photos/id/1043/900/560",
            title: "Forest path",
            description: "A quiet walk through dense trees and soft light."
          }
        ]
      };
    </script>
    <script src="./imageCarousel.js"></script>
  </body>
</html>
