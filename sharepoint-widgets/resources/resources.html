<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resource Portal</title>
    <script src="https://mdigital.sharepoint.com/sites/ITOTCommunityHub/SiteAssets/ExternalLibs/jquery371.min.js"></script>
    <style>
        .resourcePortal-container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
        }

        .headerText {
            color: #0f69af;
            font-weight: 600;
        }

        .dropdownContainer {
            gap: 15px;
            display: flex;
            border-bottom: 1px solid lightgray;
            padding-bottom: 20px;
            justify-content: space-between;
        }

        .searchArea {
            border: 1px solid #437bb2;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #437bb2;
            background-color: white;
            width: 100%;
        }

        .searchArea img {
            margin-left: 10px;
            width: 20px;
            height: 20px;
        }

        #searchInput {
            margin: 2px;
            border: none;
            outline: none;
            flex: 1;
            color: #437bb2;
            background: transparent;
        }

        .dropdown {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .roundCheck-button {
            font-size: 18px;
            min-width: 160px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            background-color: #0f69af;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .roundCheck-button.active {
            background-color: #005190;
        }

        .roundCheck-button::after {
            content: '';
            display: inline-block;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            margin-left: 10px;
            background-color: white;
        }

        .roundCheck-button::after {
            background-color: #96D7D2;
        }

        #toolsBtn::after {
            background-color: #FFC832;
        }

        .roundCheck-button.active::after {
            background-color: #005190;
            outline: 2px solid #96D7D2;
            width: 20px;
            height: 20px;
        }

        #toolsBtn.active::after {
            background-color: #005190;
            outline: 2px solid #FFC832;   
        }

        .dropdown-button {
            font-size: 18px;
            min-width: 160px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            background-color: #0f69af;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .dropdown-button::after {
            content: '\25BC';
            font-size: 20px;
            margin-left: 10px;
        }

        .dropdown-button.active::after {
            display: inline-block;
            transform: rotate(180deg);
            transition: transform 0.3s ease;
        }

        #categoryDropdown {
            background-color: #ffd972;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            min-width: 100%;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1;
            list-style: none;
            padding: 5px 0;
            border-radius: 3px;
            max-height: 300px;
            overflow-y: auto;
            top: 24px;
        }

        .dropdown-menu li {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            color: #000;
        }

        .dropdown-menu li::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid white;
            border-radius: 50%;
            margin-right: 10px;
            background-color: white;
        }

        .dropdown-menu li:hover {
            background-color: #0f69af;
            color: white;
        }

        .dropdown-menu li:hover::before {
            border-color: white;
            background-color: white;
        }

        .dropdown-menu li.selected::before {
            background-color: #0f69af;
        }

        .dropdown-menu li.selected {
            font-weight: bold;
        }

        .accordionItem {
            position: relative;
            margin: 15px 0;
            overflow: visible;
        }

        .accordionContainer {
            display: flex;
            position: relative;
            align-items: center;
            padding: 15px;
            background-color: #e3f0fb;
            cursor: pointer;
            border-left: 28px solid #FFC832
        }

        .acc-blue {
            border-left: 28px solid #96D7D2;
        }


        .accordionContent {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .accordionMainContent {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 50px;
            width: 100%;
        }

        .accordionActions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .accordionText {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 5px;
            width: 250px;
            min-width: 250px;
            color: #000000;
        }

        .accordionSector {
            font-size: 16px;
            color: #0f69af;
            font-weight: 600;
            margin-bottom: 5px;
            width: 200px;
            min-width: 200px;
        }

        .manGoId {
            font-size: 14px;
            font-weight: 600;
            width: 150px;
            min-width: 150px;
            color: #000000;
        }

        .moreInfoContainer {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .accordionDropdown {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
        }

        .arrow {
            font-size: 23px;
            color: #0f69af;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .moreInfoContainer.active .arrow {
            transform: rotate(180deg);
        }

        .goToButton {
            background-color: #0f69af;
            color: white;
            border: none;
            padding: 14px 10px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 120px;
            width: 145px;
            height: 45px;
            box-sizing: border-box;
        }

        .hiddenText {
            display: none;
            position: relative;
            padding: 15px 15px 15px 45px;
            background-color: #F2F2F2;
            color: #000000;
        }

        .hiddenText * {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif !important;

        }

        @media (max-width: 950px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .dropdownContainer {
                flex-direction: column;
                gap: 10px;
            }

            .searchArea {
                width: 100%;
            }

            input {
                margin: 10px;
            }

            .dropdown {
                width: 100%;
            }

            .accordionMainContent {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }
        }

        @media (min-width: 951px) and (max-width: 1193px) {
            .dropdownContainer {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-auto-rows: minmax(45px, auto);
                gap: 15px;
            }

            .dropdown:nth-child(-n + 3) {
                grid-column: span 1;
            }

            .dropdown:nth-child(4) {
                grid-column: 2 / 4;
            }

            .dropdown-button,
            .roundCheck-button {
                white-space: normal;
                height: auto;
                min-height: 45px;
                padding: 8px 12px;
            }
        }
    </style>
</head>

<body>
    <div class="resourcePortal-container">
        <div class="header">
            <div class="headerText">
                You can use the following filters or enter a search term in the search functions:
            </div>
        </div>

        <div class="dropdownContainer">
            <div class="dropdown">
                <button class="roundCheck-button" id="standardsBtn">Standards & Procedures</button>
            </div>
            <div class="dropdown">
                <button class="roundCheck-button" id="toolsBtn">Tools & Applications</button>
            </div>
            <div class="dropdown">
                <button class="dropdown-button" id="categoryDropdown-btn">Category</button>
                <ul class="dropdown-menu" id="categoryDropdown"></ul>
            </div>
            <div class="searchArea">
                <img src="https://mdigital.sharepoint.com/sites/ITOTCommunityHub/SiteAssets/searchIcon.svg" alt="">
                <input type="text" id="searchInput" placeholder="Enter your search term here...">
            </div>
        </div>

        <div id="resourcesContainer"></div>
    </div>

    <script src="https://mdigital.sharepoint.com/sites/ITOTCommunityHub/SiteAssets/scripts/KeyResources.js"></script>
</body>

</html>
