<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Training Portal</title>
    <script src="https://mdigital.sharepoint.com/sites/ITOTCommunityHub/SiteAssets/ExternalLibs/jquery371.min.js"></script>
    <style>
      .resourcePortal-container {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 0;
        gap: 15px;
      }

      .header .dropdown {
        flex: 0 0 calc(25% - 12px);
      }

      .headerText {
        color: #0f69af;
        flex: 1;
        font-size: 18px;
        font-weight: 600;
      }

      .dropdownContainer {
        gap: 15px;
        display: flex;
        border-bottom: 1px solid lightgray;
        padding-bottom: 20px;
      }

      .dropdown {
        position: relative;
        display: inline-block;
        flex: 1;
      }

      .roundCheck-button {
        font-size: 15px;
        min-width: 160px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        background-color: #0f69af;
        padding: 10px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        text-wrap: nowrap;
        gap: 10px;
        font-weight: 600;
        height: 45px;
      }

      .roundCheck-button::after {
        content: "";
        display: inline-block;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background-color: transparent;
      }

      #operatingModelBtn::after {
        outline: 2px solid #96d7d2;
      }

      #technologyBtn::after {
        outline: 2px solid #e1c3cd;
      }

      #cybersecurityBtn::after {
        outline: 2px solid #b4dc96;
      }

      #serviceManagementBtn::after {
        outline: 2px solid #CBBAEF;
      }

      #operatingModelBtn.active::after {
        background-color: #96d7d2;
      }

      #technologyBtn.active::after {
        background-color: #e1c3cd;
      }

      #cybersecurityBtn.active::after {
        background-color: #b4dc96;
      }

      #serviceManagementBtn.active::after {
        background-color: #CBBAEF;
      }

      .dropdown-button {
        font-size: 15px;
        min-width: 160px;
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
        background-color: #0f69af;
        padding: 9px;
        border: none;
        cursor: pointer;
        border-radius: 5px;
        font-weight: 600;
      }

      .dropdown-button::after {
        content: "\25BC";
        font-size: 20px;
        margin-left: 10px;
      }

      .dropdown-button.active::after {
        display: inline-block;
        transform: rotate(180deg);
        transition: transform 0.3s ease;
      }

      #roleDropdown-btn {
        background-color: #e3f0fb;
        color: #0f69af;
      }

      .dropdown-menu {
        display: none;
        position: absolute;
        min-width: 100%;
        box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        z-index: 1;
        list-style: none;
        padding: 5px 0;
        border-radius: 3px;
        max-height: 300px;
        overflow-y: auto;
        top: 25px;
        background-color: #ffd972;
      }

      .dropdown-menu li {
        padding: 10px 15px;
        cursor: pointer;
        display: flex;
        align-items: center;
        width: 100%;
        box-sizing: border-box;
        position: relative;
        color: #000;
      }

      .dropdown-menu li::before {
        content: "";
        display: inline-block;
        width: 12px;
        height: 12px;
        border: 2px solid #ddd;
        border-radius: 50%;
        margin-right: 10px;
        background-color: white;
      }

      .dropdown-menu li:hover {
        background-color: #0f69af;
        color: white;
      }

      .dropdown-menu li:hover::before {
        border-color: white;
        background-color: white;
      }

      .dropdown-menu li.selected::before {
        background-color: #0f69af;
      }

      .dropdown-menu li.selected {
        font-weight: bold;
      }

      .accordionItem {
        position: relative;
        margin: 15px 0;
        overflow: visible;
      }

      .accordionContainer {
        display: flex;
        position: relative;
        align-items: center;
        padding: 15px;
        background-color: #e3f0fb;
        cursor: pointer;
        border-left: 28px solid #96d7d2;
      }

      .accordionContainer.technology {
        border-left-color: #e1c3cd;
      }

      .accordionContainer.cybersecurity {
        border-left-color: #b4dc96;
      }

      .accordionContainer.serviceManagement {
        border-left-color: #CBBAEF;
      }

      .accordionContainer.curricula-match {
        background-color: #ffe6a3;
        border-left-color: #ffc832 !important;
      }

      .accordionContent {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .accordionMainContent {
        display: flex;
        flex-direction: row;
        align-items: center;
        width: 100%;
        justify-content: space-between;
      }

      .accordionActions {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .accordionText {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 5px;
        width: 250px;
        min-width: 250px;
        color: #000000;
      }

      .accordionCategory {
        font-size: 16px;
        color: #0f69af;
        font-weight: 600;
        margin-bottom: 5px;
        width: 270px;
        min-width: 200px;
        text-wrap: nowrap;
      }

      .accordionCategory.curricula-text {
        color: #000000;
        font-size: 16px;
        font-weight: 600;
      }

      .internalExternalBadge {
        font-size: 12px;
        font-weight: 700;
        padding: 4px 10px;
        border-radius: 999px;
        color: #000;
        background-color: #e9e9e9;
        margin: 0 0 5px 0;
        flex: 0 0 auto;
        align-self: center;
      }

      .internalExternalBadge.internal {
        background-color: #96d7d2;
        color: #0f4d4a;
      }

      .internalExternalBadge.external {
        background-color: #ffd972;
        color: #5a4300;
      }

      .moreInfoContainer {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }

      .accordionDropdown {
        font-size: 16px;
        font-weight: 600;
        color: #000000;
      }

      .arrow {
        font-size: 23px;
        color: #0f69af;
        display: inline-block;
        transition: transform 0.3s ease;
      }

      .moreInfoContainer.active .arrow {
        transform: rotate(180deg);
      }

      .goToButton {
        background-color: #0f69af;
        color: white;
        border: none;
        padding: 14px 10px;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 120px;
        width: 145px;
        height: 45px;
        box-sizing: border-box;
      }

      .hiddenText {
        display: none;
        position: relative;
        padding: 15px 15px 15px 45px;
        background-color: #f2f2f2;
        color: #000000;
        line-height: 1.6;
      }

      .hiddenText * {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif !important;
      }

      .no-results {
        text-align: center;
        padding: 40px;
        color: #666;
        font-size: 18px;
        background-color: #f9f9f9;
        border-radius: 5px;
        margin-top: 20px;
      }

      @media (max-width: 950px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .dropdownContainer {
          flex-direction: column;
          gap: 10px;
        }

        .dropdown {
          width: 100%;
        }

        .accordionMainContent {
          flex-direction: column;
          align-items: flex-start;
          gap: 10px;
        }

        .dropdown-button,
        .roundCheck-button {
          width: 100%;
          box-sizing: border-box;
        }
      }

      @media (min-width: 951px) and (max-width: 1193px) {
        .dropdownContainer {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          grid-auto-rows: minmax(45px, auto);
          gap: 15px;
        }

        .dropdown-button,
        .roundCheck-button {
          white-space: normal;
          height: auto;
          min-height: 45px;
          padding: 8px 12px;
        }
      }
    </style>
  </head>

  <body>
    <div class="resourcePortal-container">
      <div class="header"></div>
      <div class="dropdownContainer">
        <div class="dropdown">
          <button class="roundCheck-button" id="operatingModelBtn">
            IT/OT Operating Model
          </button>
        </div>
        <div class="dropdown">
          <button class="roundCheck-button" id="technologyBtn">
            IT/OT Technology & Architecture
          </button>
        </div>
        <div class="dropdown">
          <button class="roundCheck-button" id="cybersecurityBtn">
            IT/OT Cybersecurity
          </button>
        </div>
        <div class="dropdown">
          <button class="roundCheck-button" id="serviceManagementBtn">
            IT/OT Service Management
          </button>
        </div>
      </div>

      <div id="resourcesContainer"></div>
    </div>

    <script src="https://mdigital.sharepoint.com/sites/ITOTCommunityHub/SiteAssets/scripts/itot_training.js">
    </script>
  </body>
</html>
